[package]
name = "earmark-desktop"
description = "Earmark for Windows and Linux"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/christian-ofigueiredo/earmark-sound-library"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
earmark-core = { path = "../../engine/crates/earmark-core" }
earmark-db = { path = "../../engine/crates/earmark-db" }
earmark-audio = { path = "../../engine/crates/earmark-audio" }
earmark-mcp = { path = "../../engine/crates/earmark-mcp" }
earmark-models = { path = "../../engine/crates/earmark-models" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
