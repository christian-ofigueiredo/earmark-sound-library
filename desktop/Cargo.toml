[package]
name = "earmark-desktop"
description = "Earmark for Windows and Linux, drawn with egui (wgpu + winit)"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/christian-ofigueiredo/earmark-sound-library"
publish = false
build = "build.rs"

[[bin]]
name = "earmark-desktop"
path = "src/main.rs"

[dependencies]
earmark-core = { path = "../engine/crates/earmark-core" }
earmark-db = { path = "../engine/crates/earmark-db" }
earmark-audio = { path = "../engine/crates/earmark-audio" }
earmark-mcp = { path = "../engine/crates/earmark-mcp" }
earmark-models = { path = "../engine/crates/earmark-models" }
serde_json = { version = "1", features = ["float_roundtrip"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "wayland"] }
egui = "0.37"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }
rfd = "0.18"
opener = { version = "0.9", features = ["reveal"] }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }


# The Windows .exe's own icon (taskbar, Explorer); the window's comes from assets/icon.png.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
