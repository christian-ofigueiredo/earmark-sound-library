[package]
name = "earmark-mcp"
description = "Earmark's MCP server: finding sounds in the libraries and putting them on a timeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "earmark-mcp"
path = "src/main.rs"

[dependencies]
earmark-core.workspace = true
earmark-db.workspace = true
earmark-resolve.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["io-util"] }
