[package]
name = "earmark-db"
description = "Earmark's library database: the same schema and rules as the Swift app, so both open the same file"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
earmark-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# SQLite built into the engine (Windows, Linux, the MCP server). The Mac app's engine
# (earmark-ffi) turns it off and uses the system's SQLite, the one GRDB uses: two copies of
# SQLite in one process opening the same file can lose each other's locks.
default = ["bundled"]
bundled = ["rusqlite/bundled"]
