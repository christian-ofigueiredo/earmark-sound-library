# Earmark's engine in Rust (docs/rust-engine-plan.md). Each piece must give the same results as
# the Swift code in app/Sources/EarmarkCore; tests and the parity tool check that.
[workspace]
resolver = "3"
members = [
    "crates/earmark-core",
    "crates/earmark-db",
    "crates/earmark-audio",
    "crates/earmark-models",
    "crates/earmark-resolve",
    "crates/earmark-mcp",
    "crates/earmark-cli",
    "crates/earmark-ffi",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/christian-ofigueiredo/earmark-sound-library"

[workspace.dependencies]
earmark-core = { path = "crates/earmark-core" }
earmark-db = { path = "crates/earmark-db", default-features = false }
earmark-audio = { path = "crates/earmark-audio" }
earmark-models = { path = "crates/earmark-models" }
earmark-resolve = { path = "crates/earmark-resolve" }
base64 = "0.22"
encoding_rs = "0.8"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "api-31"] }
quick-xml = "0.38"
regex = "1"
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
rusqlite = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uniffi = "=0.32.2"
symphonia = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
