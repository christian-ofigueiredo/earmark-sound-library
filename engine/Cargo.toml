# Earmark's engine in Rust (docs/rust-engine-plan.md). Each piece must give the same results as
# the Swift code in app/Sources/EarmarkCore; tests and the parity tool check that.
[workspace]
resolver = "3"
members = [
    "crates/earmark-core",
    "crates/earmark-db",
    "crates/earmark-resolve",
    "crates/earmark-mcp",
    "crates/earmark-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/christian-ofigueiredo/earmark-sound-library"

[workspace.dependencies]
earmark-core = { path = "crates/earmark-core" }
earmark-db = { path = "crates/earmark-db" }
earmark-resolve = { path = "crates/earmark-resolve" }
base64 = "0.22"
encoding_rs = "0.8"
quick-xml = "0.38"
regex = "1"
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
