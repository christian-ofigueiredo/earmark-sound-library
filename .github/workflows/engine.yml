name: Engine

on:
  push:
    paths: ["engine/**", "app/Sources/EarmarkCore/Resources/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "app/Sources/EarmarkCore/Resources/**", ".github/workflows/engine.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    # The Rust engine (docs/rust-engine-plan.md) must build and pass on every system Earmark targets.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
      - name: Test
        run: cargo test --locked
      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
