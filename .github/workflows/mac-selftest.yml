# Run by hand (Actions tab → "Mac install test" → Run workflow): installs
# everything with setup.sh on an Apple Silicon Mac and runs the quick self-test
# with real models. Takes ~20-30 minutes. GitHub's Mac runners report an Apple
# GPU (MPS) but with almost no usable memory, so this run also exercises the
# tools' automatic fall-back to the CPU.
name: Mac install test

on:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        working-directory: phase0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch/hub
          key: models-${{ hashFiles('phase0/soundlab/embeddings.py', 'phase0/soundlab/music.py') }}
      - name: Setup
        run: ./setup.sh
      - name: Self-test (quick)
        run: ./lab selftest --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-reports
          path: ~/SoundLab/selftest-*/reports
          if-no-files-found: ignore
