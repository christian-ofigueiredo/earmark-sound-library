name: App

on:
  push:
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build and test (macOS)
    # The app uses macOS 26 APIs (Liquid Glass), so it needs Xcode 26's SDK: macos-15 has
    # Xcode 16 and couldn't build it.
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - uses: actions/cache@v4
        with:
          path: app/.build
          # The build folder holds absolute paths (Clang's module cache), so the key names the
          # repository: after the rename, the old cache broke the build.
          key: spm-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('app/Package.resolved') }}
      - name: Build (app and core)
        run: swift build
      - name: Test (core)
        run: swift test
