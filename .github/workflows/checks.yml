# Fast checks on every push: lint + tests that need no AI models (~1 minute).
name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: phase0/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Lint
        run: python -m pyflakes soundlab/*.py *.py tests/*.py
      - name: Tests
        run: python -m pytest
