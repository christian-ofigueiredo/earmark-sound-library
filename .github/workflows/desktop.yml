name: Desktop

# Builds Earmark for Windows (installer) and Linux (AppImage and .deb) from desktop/ and the Rust
# engine. Every run keeps the files as downloadable artifacts (Actions → Desktop → the run →
# Artifacts). Publishing a release stays a person's job.

on:
  push:
    # Branches as well as tags: naming only tags would leave branch pushes out.
    branches: ["**"]
    paths: ["desktop/**", "engine/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "engine/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux
            # Ubuntu 24.04: the ONNX Runtime the engine links in (ort's prebuilt library) needs
            # glibc 2.38 and a newer libstdc++ than 22.04 has. The AppImage then runs on 2024
            # distributions and later (Ubuntu 24.04, Debian 13, Fedora 39…).
            os: ubuntu-24.04
            bundles: appimage,deb
            files: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustc --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Lint
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: Earmark-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
