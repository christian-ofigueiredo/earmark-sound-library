name: Desktop

# Builds Earmark for Windows and Linux (desktop/: a drawn egui window on the Rust engine). Every
# run keeps the programs as downloadable artifacts (Actions → Desktop → the run → Artifacts).
# Publishing a release stays a person's job.

on:
  push:
    # Branches as well as tags: naming only tags would leave branch pushes out.
    branches: ["**"]
    paths: ["desktop/**", "engine/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "engine/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            # Ubuntu 24.04: the ONNX Runtime the engine links in (ort's prebuilt library) needs
            # glibc 2.38 and a newer libstdc++ than 22.04 has. The program then runs on 2024
            # distributions and later (Ubuntu 24.04, Debian 13, Fedora 39…).
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        # ALSA for playing sounds; winit loads X11 and Wayland when it runs.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-native-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
      - name: Lint
        working-directory: desktop
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        working-directory: desktop
        run: cargo build --locked --release
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp desktop/target/release/earmark-desktop.exe out/Earmark.exe
          else
            cp desktop/target/release/earmark-desktop out/earmark
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Earmark-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
